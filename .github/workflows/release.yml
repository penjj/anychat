name: release

# Builds the four targets the project ships for:
#   macOS arm64, macOS x64, Windows arm64, Windows x64
#
# Windows on ARM has no hosted runner, so that leg cross-compiles from the x64
# runner: the Rust target is installed and the MSVC toolchain for arm64 is added
# to the existing Visual Studio install before building.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One failing target must not cancel the others; a partial release is more
      # useful than none, and the failing leg is obvious in the summary.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: mac-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: mac-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            name: win-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Pin the registry. A lockfile generated behind a mirror records that
          # mirror's URLs, and a mirror that rate-limits or 503s fails every
          # leg at once -- which is exactly how a release died with no code
          # change behind it.
          registry-url: https://registry.npmjs.org

      # The rail UI is a build input, not a committed artefact: `frontend/` is
      # regenerated here so the bundle always matches the source in this commit.
      - name: Build UI
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Windows arm64 needs the MSVC linker for that architecture, which the
      # hosted image does not install by default.
      - name: Add arm64 MSVC toolchain
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vs -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = "`"$path\Common7\Tools\VsDevCmd.bat`""
          & cmd /c "$devcmd -arch=arm64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
            }

      # Git Bash ships `link.exe` (coreutils link), and on a windows runner it
      # shadows the MSVC linker, so a bash shell breaks the arm64 leg with
      # "extra operand". pwsh keeps the real linker first on PATH; the arm64
      # MSVC environment set up above is already in GITHUB_ENV either way.
      # Updater signing. The private key never leaves the repository secrets;
      # the public half is compiled in via tauri.conf.json.
      #
      # Signing is skipped when the secret is absent rather than failing the
      # build: without it the updater artefacts are simply unsigned, and a
      # release that people can install by hand is better than a red run. Set
      # the secrets and the same command produces signed ones.
      - name: Build bundle
        run: npm run tauri build -- --target ${{ matrix.target }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri names its outputs per format, so collect whatever this platform
      # produced instead of guessing the extension.
      - uses: actions/upload-artifact@v4
        with:
          name: anychat-${{ matrix.name }}
          if-no-files-found: error
          # The signatures sit beside their installers: `-setup.exe.sig` and
          # `_en-US.msi.sig`. They were missing from this list, so the Windows
          # legs uploaded unsigned payloads and nothing on Windows could ever
          # be updated. The .nsis.zip pattern is kept for the v1-compatible
          # bundling mode, which wraps the installer instead of signing it bare.
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.zip.sig

  # Attaches every artefact to the tag's release. Runs after all legs so the
  # release appears complete rather than growing file by file.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # The merge and mirror scripts live in the repo, so the job needs the
      # sources as well as the artefacts. Without this the two python steps
      # fail with "No such file or directory" and no release is published.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f | sort

      # The bundle file names are identical on both macOS legs (and on both
      # Windows legs), so uploading them flat would overwrite one with the
      # other. Rename to include the target before anything is published.
      #
      # VERSION comes from tauri.conf.json rather than the tag: the tag names
      # the release, the config names the build, and the updater compares
      # against the latter. A mismatch would look like an available update
      # forever.
      - name: Rename payloads per target
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for leg_dir in artifacts/*/; do
            leg=$(basename "$leg_dir")
            case "$leg" in
              *mac-arm64) TARGET=darwin-aarch64 ;;
              *mac-x64)   TARGET=darwin-x86_64 ;;
              *win-x64)   TARGET=windows-x86_64 ;;
              *win-arm64) TARGET=windows-aarch64 ;;
              *) continue ;;
            esac
            # Windows signs the .exe.zip when the bundler emits one, and the
            # bare installer otherwise. Both are accepted; a name ending in
            # .nsis.zip would match nothing the bundler ever writes.
            for f in "$leg_dir"macos/*.app.tar.gz \
                     "$leg_dir"nsis/*.exe.zip "$leg_dir"nsis/*.exe \
                     "$leg_dir"msi/*.msi.zip; do
              [ -e "$f" ] || continue
              # Only files with a signature are updatable payloads; the bare
              # installer beside a signed zip is the same build and would
              # otherwise be picked up twice.
              [ -e "$f.sig" ] || continue
              case "$f" in
                *.app.tar.gz) SUFFIX=app.tar.gz ;;
                *.exe.zip)    SUFFIX=exe.zip ;;
                *.exe)        SUFFIX=exe ;;
                *.msi.zip)    SUFFIX=msi.zip ;;
                *) continue ;;
              esac
              dir=$(dirname "$f")
              # Rename the payload and its signature together, so the pair
              # stays adjacent for the manifest step.
              mv "$f" "$dir/AnyChat_${VERSION}_${TARGET}.${SUFFIX}"
              mv "$f.sig" "$dir/AnyChat_${VERSION}_${TARGET}.${SUFFIX}.sig"
            done
          done
          find artifacts -name 'AnyChat_*' -type f | sort

      # Tauri signs each payload but writes no manifest, so the document the
      # updater reads is assembled from what the bundler actually left behind.
      - name: Build updater manifest
        run: python3 scripts/build-updater-manifest.py artifacts . "$VERSION" "${GITHUB_REF_NAME}"

      # Mirrored copies, one per proxy, whose platform URLs point at that
      # proxy. Paired with the endpoint list in the app: a network that cannot
      # reach GitHub fetches latest-mirrorN.json through proxy N and then the
      # payload through the same one. The signature covers the payload, not the
      # URL, so a rewritten host still verifies.
      - name: Emit mirrored manifests
        run: python3 scripts/mirror-manifest.py latest.json .

      - uses: softprops/action-gh-release@v2
        with:
          # latest.json must sit at the release root: the updater endpoint is
          # releases/latest/download/latest.json, which is a flat URL. The
          # mirrors sit beside it for the same reason.
          files: |
            artifacts/**/*
            latest.json
            latest-mirror*.json
          fail_on_unmatched_files: false
