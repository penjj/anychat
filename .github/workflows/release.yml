name: release

# Builds the four targets the project ships for:
#   macOS arm64, macOS x64, Windows arm64, Windows x64
#
# Windows on ARM has no hosted runner, so that leg cross-compiles from the x64
# runner: the Rust target is installed and the MSVC toolchain for arm64 is added
# to the existing Visual Studio install before building.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One failing target must not cancel the others; a partial release is more
      # useful than none, and the failing leg is obvious in the summary.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: mac-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: mac-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            name: win-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The rail UI is a build input, not a committed artefact: `frontend/` is
      # regenerated here so the bundle always matches the source in this commit.
      - name: Build UI
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Windows arm64 needs the MSVC linker for that architecture, which the
      # hosted image does not install by default.
      - name: Add arm64 MSVC toolchain
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vs -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = "`"$path\Common7\Tools\VsDevCmd.bat`""
          & cmd /c "$devcmd -arch=arm64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
            }

      # Git Bash ships `link.exe` (coreutils link), and on a windows runner it
      # shadows the MSVC linker, so a bash shell breaks the arm64 leg with
      # "extra operand". pwsh keeps the real linker first on PATH; the arm64
      # MSVC environment set up above is already in GITHUB_ENV either way.
      # Updater signing. The private key never leaves the repository secrets;
      # the public half is compiled in via tauri.conf.json.
      #
      # Signing is skipped when the secret is absent rather than failing the
      # build: without it the updater artefacts are simply unsigned, and a
      # release that people can install by hand is better than a red run. Set
      # the secrets and the same command produces signed ones.
      - name: Build bundle
        run: npm run tauri build -- --target ${{ matrix.target }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri names its outputs per format, so collect whatever this platform
      # produced instead of guessing the extension.
      - uses: actions/upload-artifact@v4
        with:
          name: anychat-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip.sig

  # Attaches every artefact to the tag's release. Runs after all legs so the
  # release appears complete rather than growing file by file.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f | sort

      # Tauri emits a latest.json per build, each describing only its own
      # platform. The updater reads one document, so the four are merged into a
      # single manifest keyed by target triple.
      - name: Merge updater manifests
        run: python3 scripts/merge-updater-manifest.py artifacts latest.json

      - uses: softprops/action-gh-release@v2
        with:
          # latest.json must sit at the release root: the updater endpoint is
          # releases/latest/download/latest.json, which is a flat URL.
          files: |
            artifacts/**/*
            latest.json
          fail_on_unmatched_files: false
