<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>启动动画字体预览</title>
<style>
  :root {
    --bg: #131315;
    --rail: #17171a;
    --elev: #1e1e22;
    --hover: #26262c;
    --fg: #e8e8ea;
    --muted: #85858f;
    --border: #2a2a30;
    --accent: #7c8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 32px 60px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card {
    background: var(--elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px 12px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .card:hover { border-color: var(--accent); }
  .card.picked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--elev)); }
  .name { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .label { font-size: 11px; color: var(--muted); opacity: .65; margin-bottom: 10px; }
  canvas { display: block; width: 100%; height: 84px; }
  .specimen {
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: .02em;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
  }
  .meta { font-size: 11px; color: var(--muted); opacity: .7; }
  .picked .meta { color: var(--accent); opacity: 1; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--rail) 92%, transparent);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 10px 32px;
    display: flex; align-items: center; gap: 14px;
    font-size: 12px;
  }
  .bar code { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  .hint { color: var(--muted); }
</style>
</head>
<body>
<h1>启动动画字体</h1>
<div class="sub">卡片里的字是启动动画真实的取样方式（mote 点阵），点一张卡片看全尺寸动效。</div>
<div class="grid" id="grid"></div>
<div class="bar">
  <span class="hint">选中：</span><code id="picked">—</code>
  <span class="hint" style="margin-left:auto">点卡片切换全尺寸预览；再点同一张取消</span>
</div>

<script>
// Each entry is the CSS font shorthand stack the particle sampler would use.
const FONTS = [
  { id: 'sf',        name: 'SF Pro / 系统',      stack: '-apple-system, BlinkMacSystemFont, "SF Pro Display"', weight: 800, note: '当前实现' },
  { id: 'helvetica', name: 'Helvetica Neue',    stack: '"Helvetica Neue", Helvetica', weight: 800, note: '瑞士中性' },
  { id: 'avenir',    name: 'Avenir Next',       stack: '"Avenir Next", Avenir', weight: 800, note: '几何人文' },
  { id: 'futura',    name: 'Futura',            stack: 'Futura, "Futura Condensed"', weight: 700, note: '几何先锋' },
  { id: 'din',       name: 'DIN Alternate',     stack: '"DIN Alternate"', weight: 700, note: '工业技术' },
  { id: 'dincond',   name: 'DIN Condensed',     stack: '"DIN Condensed"', weight: 700, note: '窄体硬朗' },
  { id: 'menu',      name: 'Menlo',             stack: 'Menlo, ui-monospace', weight: 700, note: '等宽终端' },
  { id: 'jetbrains', name: 'JetBrains Mono',    stack: '"JetBrains Mono"', weight: 800, note: '等宽现代' },
  { id: 'firacode',  name: 'Fira Code',         stack: '"Fira Code"', weight: 700, note: '等宽人文' },
  { id: 'input',     name: 'Input Mono',        stack: '"Input Mono"', weight: 700, note: '等宽窄' },
  { id: 'didot',     name: 'Didot',             stack: 'Didot', weight: 700, note: '高对比衬线' },
  { id: 'bodoni',    name: 'Bodoni 72',         stack: '"Bodoni 72"', weight: 700, note: '现代衬线' },
  { id: 'copper',    name: 'Copperplate',       stack: 'Copperplate', weight: 700, note: '铭刻大写' },
  { id: 'optima',    name: 'Optima',            stack: 'Optima', weight: 700, note: '人文无衬线' },
  { id: 'gill',      name: 'Gill Sans',         stack: '"Gill Sans"', weight: 700, note: '英式经典' },
  { id: 'newyork',   name: 'New York',          stack: '"New York"', weight: 700, note: '系统衬线' },
];

const TEXT = 'AnyChat';
let picked = null;

/** Mirrors the splash sampler: fill the word, then keep every Nth opaque pixel
 *  so the preview shows how dense the actual mote field would be. */
function motes(canvas, font) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const c = canvas.getContext('2d', { willReadFrequently: true });
  c.scale(dpr, dpr);
  c.clearRect(0, 0, w, h);

  const size = Math.min(w / (TEXT.length * 0.62), h * 0.62);
  c.font = `${font.weight} ${size}px ${font.stack}`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = '#fff';
  c.fillText(TEXT, w / 2, h / 2);

  const img = c.getImageData(0, 0, canvas.width, canvas.height);
  const data = img.data;
  c.clearRect(0, 0, w, h);

  // Sample stride scales with area so every card looks equally dense.
  const area = canvas.width * canvas.height;
  const step = Math.max(2, Math.round(Math.sqrt(area / 5200)));
  const grad = c.createLinearGradient(0, h * 0.3, 0, h * 0.75);
  grad.addColorStop(0, 'hsl(196 96% 72%)');
  grad.addColorStop(1, 'hsl(268 92% 70%)');
  c.fillStyle = grad;
  for (let y = 0; y < canvas.height; y += step) {
    for (let x = 0; x < canvas.width; x += step) {
      if (data[(y * canvas.width + x) * 4 + 3] > 128) {
        c.fillRect(x / dpr, y / dpr, 1.5, 1.5);
      }
    }
  }
}

const grid = document.getElementById('grid');
const pickedEl = document.getElementById('picked');

FONTS.forEach((font) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = font.id;
  card.innerHTML = `
    <div class="name">${font.name}</div>
    <div class="label">${font.note}</div>
    <div class="specimen" style="font-family:${font.stack};font-weight:${font.weight}">${TEXT}</div>
    <div class="meta">${font.stack}</div>
  `;
  const cv = document.createElement('canvas');
  cv.style.height = '52px';
  cv.style.marginBottom = '10px';
  card.insertBefore(cv, card.children[2]);
  grid.appendChild(card);

  // Canvas needs the element laid out before it can size itself.
  requestAnimationFrame(() => motes(cv, font));
  window.addEventListener('resize', () => motes(cv, font));

  card.addEventListener('click', () => {
    const isPicked = picked === font.id;
    picked = isPicked ? null : font.id;
    document.querySelectorAll('.card').forEach((n) => {
      n.classList.toggle('picked', n.dataset.id === picked);
    });
    pickedEl.textContent = picked ? font.name : '—';
    if (picked) openFull(font);
    else closeFull();
  });
});

// Full-size preview: the foundry at the real splash scale, no cards in the way.
function openFull(font) {
  closeFull();
  const wrap = document.createElement('div');
  wrap.id = 'full';
  wrap.style.cssText = `
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:grid; place-items:center;`;
  const cv = document.createElement('canvas');
  cv.style.cssText = 'width:min(76vw,900px);height:min(38vh,300px)';
  wrap.appendChild(cv);
  const cap = document.createElement('div');
  cap.textContent = `${font.name}  ·  ${font.weight}  ·  点击任意处返回`;
  cap.style.cssText = 'position:absolute;bottom:26px;color:var(--muted);font-size:12px';
  wrap.appendChild(cap);
  wrap.addEventListener('click', () => {
    picked = null;
    pickedEl.textContent = '—';
    document.querySelectorAll('.card').forEach((n) => n.classList.remove('picked'));
    closeFull();
  });
  document.body.appendChild(wrap);
  requestAnimationFrame(() => motes(cv, font));
}
function closeFull() {
  const old = document.getElementById('full');
  if (old) old.remove();
}
</script>
</body>
</html>
