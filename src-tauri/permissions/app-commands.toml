[[permission]]
identifier = "splash-done"
description = "Allows the launch animation window to hand over to the main window."
commands.allow = ["splash_done"]

[[permission]]
identifier = "splash-stats"
description = "Allows the launch animation window to report how many glyph points it sampled, so a sparse word shows up in the boot log."
commands.allow = ["splash_stats"]

[[permission]]
identifier = "reclaim-tool"
description = "Allows the rail to destroy one idle tool webview to give its memory back."
commands.allow = ["reclaim_tool"]

[[permission]]
identifier = "reclaim-all-idle"
description = "Allows the rail to destroy every idle tool webview."
commands.allow = ["reclaim_all_idle"]

[[permission]]
identifier = "resident-tools"
description = "Allows the rail to ask which tool webviews are currently resident."
commands.allow = ["resident_tools"]

[[permission]]
identifier = "menu-open"
description = "Allows the rail to hide the content webview while a context menu is showing over it."
commands.allow = ["menu_open"]

[[permission]]
identifier = "menu-close"
description = "Allows the rail to restore the content webview after a context menu closes."
commands.allow = ["menu_close"]

[[permission]]
identifier = "set-pin"
description = "Allows the rail to toggle pin-to-top for the main window."
commands.allow = ["set_pin"]

[[permission]]
identifier = "resize-window"
description = "Allows the rail to drive an interactive window resize from the window corners and edges."
commands.allow = ["resize_window"]

[[permission]]
identifier = "set-theme"
description = "Allows the settings panel to switch the colour theme."
commands.allow = ["set_theme"]

[[permission]]
identifier = "set-shortcut"
description = "Allows the settings panel to rebind the summon accelerator."
commands.allow = ["set_shortcut"]

[[permission]]
identifier = "reclaim-tool"
description = "Allows the rail to free one tool's webview and its render process."
commands.allow = ["reclaim_tool"]

[[permission]]
identifier = "reclaim-all-idle"
description = "Allows the rail to free every idle tool webview."
commands.allow = ["reclaim_all_idle"]

[[permission]]
identifier = "resident-tools"
description = "Allows the rail to list which tools currently hold a webview."
commands.allow = ["resident_tools"]

[[permission]]
identifier = "updater-check"
description = "Allows the settings panel to look for a newer release."
commands.allow = ["check_update", "install_update"]
