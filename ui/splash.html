<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AnyChat</title>
  <style>
    /* Fully transparent: this window sits over the desktop, so any background
       painted here would appear as a rectangle before the animation starts. */
    /* WKWebView paints the root element's background, so every layer on the
       path has to be clear -- not just the canvas. */
    html, body {
      margin: 0;
      height: 100%;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }
    #root {
      height: 100%;
      background: transparent;
    }
    .splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: transparent;
      overflow: hidden;
      transition: opacity 900ms cubic-bezier(0.4, 0, 0.2, 1),
                  filter 900ms cubic-bezier(0.4, 0, 0.2, 1),
                  transform 900ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Exit: release focus and let the app take over. */
    .splash.is-exiting {
      opacity: 0;
      filter: blur(14px);
      transform: scale(1.06);
    }

    /* The scrim: the particles are additive light, so without a dark ground
       they have nothing to stand against and the desktop shows straight
       through them. Centred darker than the edges, which keeps the word in a
       pool of shadow and still lets the desktop register at the borders. */
    .splash-grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 82% 74% at 50% 50%,
          rgba(6, 7, 12, 0.90) 0%,
          rgba(6, 7, 12, 0.82) 45%,
          rgba(6, 7, 12, 0.66) 72%,
          rgba(4, 5, 9, 0.58) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
      opacity: 0;
      animation: field-in 700ms ease-out forwards;
    }

    @keyframes field-in { to { opacity: 1; } }

    .splash-dust { position: absolute; inset: 0; z-index: 2; }

    /* ---------- caption ---------- */
    /* The word itself is drawn by the particle canvas, so this block only holds
       the line beneath it. It sits above the canvas but stays out of the way. */
    .splash-stage {
      position: absolute;
      left: 50%;
      /* Below centre by more than half the glyph height, so the line never
         overlaps the particles that spell the word. */
      top: calc(50% + min(11.52vw, 10vh) + 34px);
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }

    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
      font-size: clamp(15px, 1.55vw, 26px);
      font-weight: 500;
      letter-spacing: 0.46em;
      text-indent: 0.46em;
      color: rgba(226, 232, 248, 0.72);
      text-shadow: 0 2px 18px rgba(8, 10, 20, 0.85);
      /* Held back until the letters have actually resolved: the motes finish
         locking on around 2.8s, so appearing any earlier would have the caption
         describing a word that is still assembling. Then a slow 1.4s rise, well
         slower than the word itself, so it reads as a subtitle rather than a
         second headline. */
      opacity: 0;
      transform: translateY(10px);
      animation: tag-in 1400ms cubic-bezier(0.22, 0.61, 0.36, 1) 3000ms forwards;
    }
    @keyframes tag-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/splash.jsx"></script>
</body>
</html>
