<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AnyChat</title>
  <!-- Runs before first paint. The theme lives in the Rust layout file, which is
       only reachable asynchronously, so a synchronous copy is mirrored into
       localStorage; without it a light-theme window would paint dark and
       repaint, which reads as a flash on every launch. -->
  <script>
    try {
      var t = localStorage.getItem('anychat:theme')
      document.documentElement.setAttribute('data-theme', t || 'auto')
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'auto')
    }
    // Tag the platform so the stylesheet can paint an opaque backdrop on Windows.
    // The host window there is not translucent (a transparent layered window on
    // Windows swallows WebView2 clicks), so the page must provide its own
    // background instead of letting the desktop show through.
    try {
      if (/Windows/i.test(navigator.userAgent || '')) {
        document.documentElement.setAttribute('data-platform', 'win')
      }
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Icon sprite stays inline: the shell must not fetch its own chrome from
       the network, and <use href="#id"> needs the symbols in the document. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M6 4h12a1 1 0 0 1 0 2h-1v5.6l1.7 2.2a1 1 0 0 1-.8 1.6H13v4.4l-1 1-1-1V15.4H6.1a1 1 0 0 1-.8-1.6L7 11.6V6H6a1 1 0 0 1 0-2z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    </defs>
  </svg>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
